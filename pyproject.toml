[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app-banking-agent"
version = "0.1.0"
description = "LangChain Autonomous Financial Banking Agent with FastMCP Tooling and Agentic RAG"
authors = [{ name = "Enterprise X AI Architecture Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "langchain>=0.1.15",
    "langchain-openai>=0.1.3",
    "langchain-community>=0.0.32",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "E501", "RUF010", "I001"]

